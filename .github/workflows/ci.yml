name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI never touches a real database or real secrets: it runs in mock mode.
  MOCK_MODE: 'true'
  MOCK_ADMIN_EMAIL: admin@dcc.local
  MOCK_ADMIN_PASSWORD: E2ePassword!2026
  AUTH_SECRET: ci-secret-value-that-is-long-enough-for-zod-validation
  APP_URL: http://localhost:3100

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://dcc:dcc@localhost:5432/dcc?schema=public
      - run: npm run typecheck   # runs `next typegen` first
      - run: npm run lint
      - run: npm test

  render-build:
    # Reproduces the exact install + build path Render uses, in the exact
    # NODE_ENV it sees. `verify` and `e2e` never set NODE_ENV=production, so a
    # regression here (a devDependency npm prunes at that point, e.g. a build
    # tool moved out of devDependencies-that-Render-needs) shipped straight to
    # a live deploy and only surfaced there — see the incident that added this
    # job: render.yaml's buildCommand needed `--include=dev` because Render
    # exposes NODE_ENV=production during the build itself, not just at
    # runtime, and npm's default install omits devDependencies whenever that
    # variable is set.
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      MOCK_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exactly as render.yaml does
        run: npm ci --include=dev
      - run: npx prisma generate
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
