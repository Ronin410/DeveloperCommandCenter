# Render blueprint for the Developer Command Center.
#
# Create the whole stack from this file: Render Dashboard → New → Blueprint →
# pick this repository. Everything below is provisioned automatically except the
# values marked `sync: false`, which Render asks you for on first deploy.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: dcc
    runtime: node
    plan: free # upgrade to `starter` for an always-on instance (see notes below)
    region: frankfurt # oregon | frankfurt | singapore | ohio | virginia
    branch: main
    # `.nvmrc` pins Node 22; Render reads it automatically.
    #
    # `--include=dev` is required: NODE_ENV=production below is visible during
    # the build (not just at runtime), and npm's default install prunes
    # devDependencies whenever NODE_ENV=production is set. Tailwind's PostCSS
    # plugin and the TypeScript compiler live in devDependencies — needed to
    # build, not to run — so a plain `npm ci` here fails with
    # "Cannot find module '@tailwindcss/postcss'". Reproduced locally against
    # this exact lockfile before writing this comment.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Applies pending migrations, then serves. Doing it in the start command
    # (instead of a pre-deploy hook) keeps this working on the free plan, and
    # `migrate deploy` is a no-op when there is nothing pending.
    startCommand: npm run start:migrate
    # Render restarts the instance if this stops returning 2xx. /api/health
    # reports 503 when the database is unreachable, so a broken deploy is
    # caught instead of silently serving errors.
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      # Real data, not the simulated dataset.
      - key: MOCK_MODE
        value: 'false'

      # Session secret: generated once by Render and never shown in the repo.
      - key: AUTH_SECRET
        generateValue: true

      # Wired directly to the managed database below.
      - key: DATABASE_URL
        fromDatabase:
          name: dcc-postgres
          property: connectionString

      # APP_URL is intentionally absent: the app falls back to Render's
      # RENDER_EXTERNAL_URL, so cookies and the CSRF origin check are correct
      # without hardcoding the hostname. Set it explicitly when you attach a
      # custom domain.

      - key: MONITORING_INTERVAL_SECONDS
        value: '30'
      - key: NEXT_PUBLIC_POLL_INTERVAL_SECONDS
        value: '30'

      # First-run administrator. Render prompts for these on the first deploy;
      # the account is created automatically at server start and never modified
      # afterwards. Use a long, unique password — this console is on the public
      # Internet.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

      # Optional integration. Leave blank to keep using mock repository data.
      - key: GITHUB_TOKEN
        sync: false

databases:
  - name: dcc-postgres
    plan: free # free instances are removed after 30 days — see DEPLOYMENT.md
    region: frankfurt # must match the web service's region
    databaseName: dcc
    user: dcc
